<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="GameCenter — כל המשחקים במקום אחד">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090D1A">
  <title>GameCenter — מרכז המשחקים</title>
</head>
<body>
  <script>
    // Remove an older Flutter service worker/cache that may keep showing the
    // previous task-manager app after a successful GitHub Pages deployment.
    (async () => {
      if ('serviceWorker' in navigator) {
        const registrations = await navigator.serviceWorker.getRegistrations();
        await Promise.all(registrations
          .filter((registration) => new URL(registration.scope).pathname.startsWith('/gamecenter/'))
          .map((registration) => registration.unregister()));
      }
      if ('caches' in window) {
        const cacheNames = await caches.keys();
        await Promise.all(cacheNames
          .filter((name) => /flutter|gamecenter/i.test(name))
          .map((name) => caches.delete(name)));
      }
      const bootstrap = document.createElement('script');
      bootstrap.src = 'flutter_bootstrap.js?v=gamecenter-20261120-2';
      bootstrap.async = true;
      document.body.appendChild(bootstrap);
    })();
  </script>
</body>
</html>
