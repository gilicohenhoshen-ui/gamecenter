<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#17152b"><title>Pet Care — עולם החיות</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#39315c,#17152b 65%);color:#fff;font-family:Arial,sans-serif;min-height:100vh}
main{max-width:1050px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:25px;font-weight:900;letter-spacing:1px}.coins{background:#42365f;border:1px solid #78659d;border-radius:30px;padding:10px 16px}
h1{font-size:clamp(25px,4vw,38px);margin:20px 0 5px}.sub{color:#d4c9e9;margin:0 0 18px}
.stage{height:min(55vw,440px);min-height:290px;border:1px solid #746394;border-radius:26px;overflow:hidden;position:relative;background:linear-gradient(#b7d8e8 0%,#d9e7e0 57%,#9dbb9a 58%,#75966f 100%);box-shadow:0 18px 55px #08071388}
#scene{width:100%;height:100%;display:block}.stage-label{position:absolute;top:14px;right:14px;background:#221b38c9;padding:9px 13px;border-radius:20px;font-size:13px}
.pets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}.panel{background:#292440;border:1px solid #51456d;border-radius:20px;padding:16px}.petpick{display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;color:white;background:#393052;border:1px solid #675783;border-radius:15px;padding:12px;font-size:16px}.petpick.active{background:#7653a5;border-color:#c5a7ed}
.stats{display:grid;gap:10px;margin-top:14px}.statline{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}.track{height:9px;background:#49415b;border-radius:10px;overflow:hidden}.fill{height:100%;width:70%;background:linear-gradient(90deg,#a78bfa,#f0abdc);border-radius:10px;transition:width .35s}
.actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:16px}.action{border:0;border-radius:16px;padding:15px 8px;background:#72539b;color:white;font-weight:700;font-size:15px;cursor:pointer;box-shadow:0 5px 0 #4c376c;transition:transform .15s}.action:active{transform:translateY(3px);box-shadow:0 2px 0 #4c376c}.action span{display:block;font-size:25px;margin-bottom:6px}.hint{text-align:center;color:#d5cbe4;font-size:12px;margin:15px 0}
@media(max-width:600px){main{padding:12px}.stage{height:330px}.actions{grid-template-columns:repeat(2,1fr)}.panel{padding:12px}}
</style>
</head>
<body><main>
<header class="top"><div class="brand">🐾 PET CARE</div><div class="coins">🪙 <b id="coins">120</b></div></header>
<h1>עולם החיות שלי</h1><p class="sub">חברים קטנים, אהבה גדולה — דאגי לחיית המחמד שלך!</p>
<section class="stage"><canvas id="scene"></canvas><div class="stage-label" id="sceneLabel">🐶 מקס משחק בחצר</div></section>
<section class="pets"><button class="petpick active" id="dogPick">🐶 מקס · כלב</button><button class="petpick" id="catPick">🐱 לונה · חתולה</button></section>
<section class="panel"><b id="petTitle">מקס שמח לראות אותך!</b><div class="stats">
<div><div class="statline"><span>😊 שמחה</span><b id="happyText">75%</b></div><div class="track"><div class="fill" id="happy" style="width:75%"></div></div></div>
<div><div class="statline"><span>🍖 שובע</span><b id="foodText">65%</b></div><div class="track"><div class="fill" id="food" style="width:65%"></div></div></div>
<div><div class="statline"><span>🛁 ניקיון</span><b id="cleanText">70%</b></div><div class="track"><div class="fill" id="clean" style="width:70%"></div></div></div>
</div></section>
<section class="actions"><button class="action" data-action="feed"><span>🥕</span>להאכיל</button><button class="action" data-action="bath"><span>🫧</span>מקלחת</button><button class="action" data-action="play"><span>🎾</span>לשחק</button><button class="action" data-action="cuddle"><span>💗</span>ללטף</button></section>
<p class="hint" id="hint">בחרי כלב או חתולה, ואז לחצי על פעולות הטיפול. אפשר לגרור כדי לסובב את התצוגה!</p>
</main>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const canvas=document.querySelector('#scene'),stage=canvas.parentElement;
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();scene.fog=new THREE.Fog(0xc6dfd8,10,24);
const camera=new THREE.PerspectiveCamera(34,1,.1,100);camera.position.set(0,3.3,9);camera.lookAt(0,1.15,0);
scene.add(new THREE.HemisphereLight(0xffffff,0x78906f,2));
const sun=new THREE.DirectionalLight(0xfff2db,2.7);sun.position.set(-4,8,5);sun.castShadow=true;scene.add(sun);
const ground=new THREE.Mesh(new THREE.CircleGeometry(8,64),new THREE.MeshStandardMaterial({color:0x86a97b,roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.y=-.03;ground.receiveShadow=true;scene.add(ground);
const mat=(color,roughness=.82)=>new THREE.MeshStandardMaterial({color,roughness});
const sphere=new THREE.SphereGeometry(1,32,24);
function blob(parent,color,pos,scale){const m=new THREE.Mesh(sphere,mat(color));m.position.set(...pos);m.scale.set(...scale);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m}
const pet=new THREE.Group();scene.add(pet);let tail,head,legs=[],eyes=[],muzzle;let kind='dog';
function buildPet(type){
 while(pet.children.length)pet.remove(pet.children[0]);legs=[];eyes=[];kind=type;
 const fur=type==='dog'?0xc78a55:0xd6d0c7, dark=type==='dog'?0x75462d:0x77717a, belly=type==='dog'?0xf0d4ac:0xf2e9dc;
 blob(pet,fur,[0,1.12,0],[.88,.72,.55]);blob(pet,belly,[0,.85,.39],[.48,.42,.22]);
 head=new THREE.Group();head.position.set(0,1.83,.12);pet.add(head);
 blob(head,fur,[0,0,0],[.56,.55,.5]);
 if(type==='dog'){blob(head,dark,[-.36,.38,-.03],[.19,.48,.14]).rotation.z=-.22;blob(head,dark,[.36,.38,-.03],[.19,.48,.14]).rotation.z=.22;}
 else{const earGeo=new THREE.ConeGeometry(.19,.48,4);for(const x of [-.37,.37]){const ear=new THREE.Mesh(earGeo,mat(fur));ear.position.set(x,.47,0);ear.rotation.z=x<0?.18:-.18;ear.castShadow=true;head.add(ear);}}
 muzzle=blob(head,type==='dog'?0xf1d4b2:0xe8ddd2,[0,-.18,.43],type==='dog'?[.34,.22,.22]:[.24,.18,.18]);
 blob(head,0x342b2a,[0,-.09,.63],[.085,.06,.045]);
 for(const x of [-.22,.22]){const eye=blob(head,0x241e20,[x,.08,.456],[.055,.075,.035]);eyes.push(eye);blob(head,0xffffff,[x-.015,.11,.486],[.018,.02,.01]);}
 tail=new THREE.Group();tail.position.set(0,1.35,-.48);pet.add(tail);const tailMesh=blob(tail,fur,[0,.38,-.12],type==='dog'?[.15,.48,.15]:[.12,.4,.12]);tailMesh.rotation.x=-.5;
 for(const x of [-.52,.52])for(const z of [-.24,.28]){const leg=new THREE.Group();leg.position.set(x,.72,z);pet.add(leg);blob(leg,fur,[0,-.3,0],[.19,.48,.2]);blob(leg,type==='dog'?dark:fur,[0,-.55,.03],[.2,.13,.23]);legs.push(leg);}
 if(type==='cat'){const whisker=mat(0x716b69);for(const side of [-1,1])for(let j=0;j<2;j++){const line=new THREE.Mesh(new THREE.CylinderGeometry(.008,.008,.36,6),whisker);line.position.set(side*.3,-.2,.52);line.rotation.z=side*(.25+j*.2);head.add(line);}}
}
buildPet('dog');
const ball=new THREE.Group();scene.add(ball);const ballMesh=new THREE.Mesh(new THREE.SphereGeometry(.22,24,16),new THREE.MeshStandardMaterial({color:0xf05c78,roughness:.45}));ball.add(ballMesh);ball.position.set(1.55,.23,.2);
const flowers=new THREE.Group();scene.add(flowers);for(let i=0;i<16;i++){const a=i*Math.PI*2/16,r=3.1+Math.random()*1.3;const stem=new THREE.Mesh(new THREE.CylinderGeometry(.018,.025,.35,6),mat(0x477c45));stem.position.set(Math.cos(a)*r,.17,Math.sin(a)*r);flowers.add(stem);const bloom=blob(flowers,[0xf3c8e8,0xffe2a5,0xffffff][i%3],[Math.cos(a)*r,.39,Math.sin(a)*r],[.11,.11,.11]);}
let mood='idle',actionUntil=0,coins=120,stats={happy:75,food:65,clean:70},rot=0,drag=false,lastX=0;
function updateUI(){for(const k of Object.keys(stats)){document.querySelector('#'+k).style.width=stats[k]+'%';document.querySelector('#'+k+'Text').textContent=stats[k]+'%';}document.querySelector('#coins').textContent=coins;}
function choose(type){buildPet(type);document.querySelector('#dogPick').classList.toggle('active',type==='dog');document.querySelector('#catPick').classList.toggle('active',type==='cat');document.querySelector('#petTitle').textContent=type==='dog'?'מקס שמח לראות אותך!':'לונה שמחה לראות אותך!';document.querySelector('#sceneLabel').textContent=type==='dog'?'🐶 מקס משחק בחצר':'🐱 לונה משחקת בחצר';mood='happy';actionUntil=performance.now()+1200;}
document.querySelector('#dogPick').onclick=()=>choose('dog');document.querySelector('#catPick').onclick=()=>choose('cat');
document.querySelectorAll('[data-action]').forEach(btn=>btn.onclick=()=>{const a=btn.dataset.action; if(a==='feed'){stats.food=Math.min(100,stats.food+24);stats.happy=Math.min(100,stats.happy+5);mood='eat';say('יאמי! תודה על האוכל 🍎');}
if(a==='bath'){stats.clean=100;stats.happy=Math.max(0,stats.happy-2);mood='bath';say('איזה ריח נעים! ✨');}
if(a==='play'){stats.happy=Math.min(100,stats.happy+22);stats.food=Math.max(0,stats.food-8);mood='play';say('איזה כיף לשחק! 🎾');}
if(a==='cuddle'){stats.happy=Math.min(100,stats.happy+14);mood='love';say('גררר... איזה כיף ליטופים 💗');}
coins+=a==='play'?4:2;actionUntil=performance.now()+2600;updateUI();});
function say(t){document.querySelector('#hint').textContent=t;}
canvas.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;canvas.setPointerCapture(e.pointerId);});canvas.addEventListener('pointermove',e=>{if(drag){rot+=(e.clientX-lastX)*.009;lastX=e.clientX;}});canvas.addEventListener('pointerup',()=>drag=false);canvas.addEventListener('pointercancel',()=>drag=false);
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}new ResizeObserver(resize).observe(stage);resize();
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime();const active=performance.now()<actionUntil;pet.rotation.y=rot+Math.sin(t*.5)*.05;pet.position.y=Math.abs(Math.sin(t*2.3))*.045;
head.rotation.z=Math.sin(t*1.4)*.045;head.rotation.x=mood==='love'&&active?-.22:Math.sin(t*1.7)*.025;
tail.rotation.x=Math.sin(t*(mood==='happy'||mood==='play'?12:4))*(kind==='dog'?.65:.4);tail.rotation.z=Math.sin(t*3)*.18;
legs.forEach((leg,i)=>{const swing=(mood==='play'&&active)?Math.sin(t*12+i*Math.PI)*.65:Math.sin(t*2+i*Math.PI)*.035;leg.rotation.x=swing;});
ball.position.x=mood==='play'&&active?1.2+Math.sin(t*8)*.7:1.55;ball.position.y=.23+((mood==='play'&&active)?Math.abs(Math.sin(t*8))*.6:0);ball.rotation.z=t*2;
if(mood==='bath'&&active){/* gentle sparkle-like bob */pet.position.y+=Math.abs(Math.sin(t*12))*.08;}
if(mood==='eat'&&active)head.rotation.x=Math.sin(t*14)*.11;
if(mood==='love'&&active)pet.rotation.y=rot+Math.sin(t*8)*.13;
renderer.render(scene,camera);}animate();updateUI();
</script></body></html>
